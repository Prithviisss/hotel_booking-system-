services:
  - type: web
    name: grand-heritage-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false   # You will paste this in Render dashboard
      - key: JWT_SECRET
        sync: false   # You will paste this in Render dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: RAZORPAY_KEY_ID
        value: mock
      - key: RAZORPAY_KEY_SECRET
        value: mock
      - key: FRONTEND_URL
        sync: false   # You will paste your Vercel URL here after deploying frontend
